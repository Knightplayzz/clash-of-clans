on: ["push", "pull_request"]

name: Test Coveralls

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: npm install, make test-coverage
        run: |
          npm install
          npm test -- --coverage

      - name: Coveralls
        uses: coverallsapp/github-action@v2
